[project]
name = "ibm-sp-mcp-server"
version = "1.0.0"
description = "MCP Server for IBM Storage Protect - AI-powered administration and automation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "IBM SP MCP Server Contributors"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ibm",
    "storage-protect",
    "backup",
    "automation",
    "ai-assistant"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "keyring>=24.0.0"
]

[project.urls]
Homepage = "https://github.com/IBM/ibm-storage-protect-mcp-server"
Documentation = "https://github.com/IBM/ibm-storage-protect-mcp-server/tree/main/docs"
Repository = "https://github.com/IBM/ibm-storage-protect-mcp-server"
Issues = "https://github.com/IBM/ibm-storage-protect-mcp-server/issues"

[project.scripts]
sp-mcp-server = "sp_mcp_server.main:main"
mcp-server-clients-core = "sp_mcp_server.main_clients_core:main"
mcp-server-clients-config = "sp_mcp_server.main_clients_config:main"
mcp-server-storage-pools = "sp_mcp_server.main_storage_pools:main"
mcp-server-storage-hardware = "sp_mcp_server.main_storage_hardware:main"
mcp-server-storage-device = "sp_mcp_server.main_storage_device:main"
mcp-server-policies-lifecycle = "sp_mcp_server.main_policies_lifecycle:main"
mcp-server-policies-management = "sp_mcp_server.main_policies_management:main"
mcp-server-system-admin = "sp_mcp_server.main_system_admin:main"
mcp-server-system-config = "sp_mcp_server.main_system_config:main"
mcp-server-ops = "sp_mcp_server.main_ops:main_sync"
mcp-server-ops-protection = "sp_mcp_server.main_ops_protection:main"
mcp-server-ops-maintenance = "sp_mcp_server.main_ops_maintenance:main"
mcp-server-ops-rules = "sp_mcp_server.main_ops_rules:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
sse = [
    "mcp[sse]",
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel", "build>=0.10.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
sp_mcp_server = ["py.typed"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sp_mcp_server*"]
exclude = ["tests*"]
